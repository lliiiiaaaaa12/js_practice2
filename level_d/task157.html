<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цветовая палитра</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            background: #f0f0f0;
            transition: background-color 0.2s;
        }
        .panel {
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
        }
        #sample {
            width: 180px;
            height: 120px;
            margin: 20px auto;
            border: 2px solid #333;
            border-radius: 10px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
<div class="panel">
    <h1>Цветовая палитра</h1>
    <p>Выберите цвет фона страницы.</p>

    <input type="color" id="colorPicker" value="#f0f0f0">
    <div id="sample"></div>
    <h2 id="hex">#F0F0F0</h2>

    <button id="reset">Стандартный цвет</button>
    <p><a href="index.html">Назад к заданиям</a></p>
</div>

<script>
"use strict";

const picker = document.getElementById("colorPicker");
const sample = document.getElementById("sample");
const hex = document.getElementById("hex");
const defaultColor = "#f0f0f0";

function updateColor(color) {
    document.body.style.backgroundColor = color;
    sample.style.backgroundColor = color;
    hex.textContent = color.toUpperCase();
}

picker.addEventListener("input", () => {
    updateColor(picker.value);
});

document.getElementById("reset").addEventListener("click", () => {
    picker.value = defaultColor;
    updateColor(defaultColor);
});

updateColor(defaultColor);
</script>
</body>
</html>

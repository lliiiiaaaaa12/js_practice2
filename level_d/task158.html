<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор поездки</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            padding: 25px;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        label { display: block; margin-top: 15px; }
        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            font-size: 16px;
        }
        button { cursor: pointer; }
        #result { font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>Стоимость поездки</h1>

    <form id="tripForm">
        <label for="distance">Расстояние (км)</label>
        <input type="number" id="distance" min="0.01" step="any"
               placeholder="Например, 250" required>

        <label for="consumption">Расход топлива (л/100 км)</label>
        <input type="number" id="consumption" min="0.01" step="any"
               placeholder="Например, 8" required>

        <label for="price">Цена одного литра (₸)</label>
        <input type="number" id="price" min="0.01" step="any"
               placeholder="Например, 250" required>

        <button type="submit">Рассчитать</button>
    </form>

    <p id="result" aria-live="polite"></p>
    <p id="details"></p>
    <a href="index.html">Назад к заданиям</a>
</div>

<script>
"use strict";

document.getElementById("tripForm").addEventListener("submit", event => {
    event.preventDefault();

    const distance = Number(document.getElementById("distance").value);
    const consumption = Number(document.getElementById("consumption").value);
    const price = Number(document.getElementById("price").value);

    const result = document.getElementById("result");
    const details = document.getElementById("details");

    if (
        !Number.isFinite(distance) || distance <= 0 ||
        !Number.isFinite(consumption) || consumption <= 0 ||
        !Number.isFinite(price) || price <= 0
    ) {
        result.textContent = "Введите корректные положительные значения.";
        details.textContent = "";
        return;
    }

    const fuel = distance * consumption / 100;
    const cost = fuel * price;

    result.textContent = "Стоимость поездки: " +
        cost.toLocaleString("ru-RU", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }) + " ₸";

    details.textContent = "Необходимое топливо: " +
        fuel.toFixed(2) + " л";
});
</script>
</body>
</html>
